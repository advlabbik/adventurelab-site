# Anteprima del sito su GitHub Pages: https://advlabbik.github.io/adventurelab-site/
# È una copia di lavoro da passarsi (noindex, segnaposto ammessi), non il sito di
# produzione, che andrà su Cloudflare (docs/dns-cutover.md).
name: Anteprima GitHub Pages

on:
  push:
    branches: [main, feat/design-foglio]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # ≥ 23.6: scripts/check-content.mjs importa i .ts togliendo i tipi
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://advlabbik.github.io
          SITE_BASE: /adventurelab-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
