name = "adventurelab-lead"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Account aziendale Adventure Lab: senza questa riga wrangler chiede quale account
# usare e in modo non interattivo si ferma.
account_id = "fe10f419d554dfcaca3986a6e7056944"

# Log delle invocazioni conservati da Cloudflare (Workers Logs): senza, i
# console.log/console.error si vedono solo con `wrangler tail` dal vivo.
[observability]
enabled = true

[vars]
# Solo i domini veri: localhost e l'anteprima workers.dev stanno in [env.preview].
ALLOWED_ORIGINS = "https://adventurelab.cc,https://www.adventurelab.cc"

# Lista Brevo di destinazione: "Lead AdventureLab" (cartella AdventureLab), creata il 16/10/2026.
BREVO_LIST_ID = "40"

# Fail-closed. Spento solo in [env.preview], che è un worker separato.
TURNSTILE_REQUIRED = "true"

# Notifica di ogni candidatura alla casella unica del B2B (reply-to = il candidato).
# SENDER_EMAIL deve essere un mittente validato su Brevo (Senders & domains) e NON
# deve essere collab@ stessa. Vuoto = niente notifica, resta solo il contatto su Brevo.
NOTIFY_TO = "collab@bikeadventureseries.com"
# info@bikeadventureseries.com: mittente già validato su Brevo (adventurelab.cc non ne ha uno).
SENDER_EMAIL = "info@bikeadventureseries.com"
SENDER_NAME = "adventurelab.cc"

# Segreti (mai qui): BREVO_API_KEY, TURNSTILE_SECRET — con `wrangler secret put`.

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1101"

  [ratelimits.simple]
  limit = 5
  period = 60

# Anteprima e sviluppo locale: worker SEPARATO (adventurelab-lead-preview), con
# Turnstile spento perché il widget non si rende su localhost né su workers.dev.
# Non va mai collegato a una lista vera: con Turnstile spento chiunque potrebbe
# iscrivere email a caso, riempiendo una lista vera di indirizzi falsi.
#   npx wrangler dev --config wrangler.toml --env preview
#   npx wrangler deploy --config wrangler.toml --env preview
# I binding non si ereditano dall'ambiente principale: il rate limit va ridichiarato.
[env.preview]
name = "adventurelab-lead-preview"

[env.preview.vars]
ALLOWED_ORIGINS = "http://localhost:4321"
BREVO_LIST_ID = "0"
TURNSTILE_REQUIRED = "false"
# Niente notifiche dall'anteprima: senza Turnstile chiunque potrebbe riempire collab@.
NOTIFY_TO = ""
SENDER_EMAIL = ""
SENDER_NAME = "adventurelab.cc (anteprima)"

[[env.preview.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1102"

  [env.preview.ratelimits.simple]
  limit = 5
  period = 60
